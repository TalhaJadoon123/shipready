services:
  postgres:
    image: postgres:16-alpine
    container_name: shipready-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shipready
      POSTGRES_PASSWORD: shipready
      POSTGRES_DB: shipready
    ports:
      - '5432:5432'
    volumes:
      - shipready-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shipready -d shipready']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shipready-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - shipready-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shipready-pgdata:
  shipready-redisdata:
